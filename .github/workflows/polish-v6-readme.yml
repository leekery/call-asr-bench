name: Polish schema v6 README

on:
  push:
    branches:
      - feat/gain-clipping-runner

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Wrap README lines
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "G.711, packet loss, and late-frame jitter before transcription. The impairment pipeline is independent\nof which ASR adapter receives the resulting audio.",
              "G.711, packet loss, and late-frame jitter before transcription. The impairment\npipeline is independent of which ASR adapter receives the resulting audio.",
          )
          text = text.replace(
              "Schema v6 additionally records front-end gain/clipping. `callasr compare` shows explicit `Gain dB` and `Clip` columns; schema-v1 through schema-v5 artifacts render those fields as unavailable rather than assuming zero.",
              "Schema v6 additionally records front-end gain/clipping. `callasr compare` shows\nexplicit `Gain dB` and `Clip` columns; schema-v1 through schema-v5 artifacts render\nthose fields as unavailable rather than assuming zero.",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: wrap schema v6 README text"
          git push
