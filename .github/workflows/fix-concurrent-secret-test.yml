name: Fix concurrent secret test markers

on:
  push:
    branches:
      - feat/concurrent-cli-artifact

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python .github/scripts/fix_concurrent_secret_test.py
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_concurrent_cli.py
          git diff --cached --quiet && exit 0
          git commit -m "test: use unique secret leak markers"
          git push
