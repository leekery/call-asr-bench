name: Fix streaming CLI test lint

on:
  push:
    branches:
      - feat/vllm-streaming-cli

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python .github/scripts/fix_streaming_cli_tests.py
      - name: Commit test fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_streaming_cli.py
          git diff --cached --quiet && exit 0
          git commit -m "test: fix streaming CLI contract lint"
          git push
