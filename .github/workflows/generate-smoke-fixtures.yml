name: Generate smoke fixtures

on:
  push:
    branches:
      - feat/smoke-fixture-pack

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python examples/smoke/generate.py --output examples/smoke/audio
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/smoke/audio
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add generated smoke WAV fixtures"
          git push
