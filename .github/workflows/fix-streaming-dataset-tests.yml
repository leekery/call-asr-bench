name: Fix streaming dataset test mechanics

on:
  push:
    branches:
      - feat/streaming-dataset-artifact

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python .github/scripts/fix_streaming_dataset_tests.py
      - name: Commit test fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_streaming_dataset.py
          git diff --cached --quiet && exit 0
          git commit -m "test: fix streaming dataset contract mechanics"
          git push
