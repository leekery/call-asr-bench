name: Fix vLLM test lint

on:
  push:
    branches:
      - feat/vllm-realtime-adapter

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python .github/scripts/fix_vllm_test_lint.py
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_vllm_realtime_adapter.py
          git diff --cached --quiet && exit 0
          git commit -m "test: fix vLLM realtime contract lint"
          git push
