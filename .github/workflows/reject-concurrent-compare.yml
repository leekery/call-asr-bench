name: Apply concurrent compare guard

on:
  push:
    branches:
      - feat/concurrent-cli-artifact

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python .github/scripts/reject_concurrent_compare.py
      - name: Commit report guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/callasr/report.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: reject concurrent artifacts in batch compare"
          git push
