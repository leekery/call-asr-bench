[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "call-asr-bench"
version = "0.3.0"
description = "Reproducible speech-to-text benchmarks for real telephone audio"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "leekery" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
faster-whisper = [
    "faster-whisper>=1.2,<2",
]
openai-compatible = [
    "httpx>=0.28,<1",
]

[project.scripts]
callasr = "callasr.cli:main"

[project.urls]
Repository = "https://github.com/leekery/call-asr-bench"
Issues = "https://github.com/leekery/call-asr-bench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/callasr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
